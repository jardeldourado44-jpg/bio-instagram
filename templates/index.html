<!DOCTYPE html>
<html>
<head>

<title>BioCraft - Gerador de Bio</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:#1e293b;
padding:40px;
border-radius:12px;
width:450px;
box-shadow:0 0 30px rgba(0,0,0,0.6);
}

h1{
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
font-size:14px;
color:#94a3b8;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border-radius:6px;
border:none;
background:#334155;
color:white;
}

input::placeholder{
color:#94a3b8;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:6px;
background:#6366f1;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#4f46e5;
}

.results{
margin-top:25px;
}

.bio{
background:#334155;
padding:12px;
border-radius:6px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.copy{
background:#6366f1;
border:none;
color:white;
padding:6px 10px;
border-radius:5px;
cursor:pointer;
font-size:12px;
}

.copy:hover{
background:#4f46e5;
}

.counter{
margin-top:15px;
color:#94a3b8;
font-size:13px;
}

.footer{
text-align:center;
margin-top:20px;
font-size:12px;
color:#64748b;
}

</style>

<script>

function copiarBio(texto){

navigator.clipboard.writeText(texto)

alert("Bio copiada!")

}

</script>

</head>

<body>

<div class="container">

<h1>BioCraft</h1>

<div class="subtitle">
Crie bios profissionais para Instagram em segundos
</div>

<form method="POST">

<input name="profissao" placeholder="Sua profissão">

<input name="habilidade" placeholder="Sua habilidade">

<input name="cidade" placeholder="Sua cidade">

<button type="submit">Gerar Bio</button>

</form>

<div class="results">

{% for bio in bios %}

<div class="bio">

<span>{{bio}}</span>

<button class="copy" onclick="copiarBio('{{bio}}')">Copiar</button>

</div>

{% endfor %}

</div>

<div class="counter">

{% if bios %}
{{ bios|length }} bios geradas
{% endif %}

</div>

<div class="footer">

Ferramenta criada para criadores de conteúdo

</div>

</div>

</body>
</html>
