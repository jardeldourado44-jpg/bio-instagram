<!DOCTYPE html>
<html>
<head>
<title>Gerador de Bio</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:#1e293b;
padding:40px;
border-radius:12px;
width:420px;
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

h1{
text-align:center;
margin-bottom:30px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border-radius:6px;
border:none;
background:#334155;
color:white;
}

input::placeholder{
color:#94a3b8;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:6px;
background:#6366f1;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#4f46e5;
}

.result{
margin-top:25px;
}

.bio{
background:#334155;
padding:12px;
border-radius:6px;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>Gerador de Bio</h1>

<form method="POST">

<input name="profissao" placeholder="Sua profissão">

<input name="habilidade" placeholder="Sua habilidade">

<input name="cidade" placeholder="Sua cidade">

<button type="submit">Gerar Bio</button>

</form>

<div class="result">

{% for bio in bios %}

<div class="bio">{{bio}}</div>

{% endfor %}

</div>

</div>

</body>
</html>
