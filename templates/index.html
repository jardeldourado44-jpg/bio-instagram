<!DOCTYPE html>
<html>
<head>

<title>BioCraft AI</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:#1e293b;
padding:40px;
border-radius:12px;
width:480px;
box-shadow:0 0 30px rgba(0,0,0,0.6);
}

h1{
text-align:center;
}

.subtitle{
text-align:center;
color:#94a3b8;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin-bottom:12px;
border-radius:6px;
border:none;
background:#334155;
color:white;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:6px;
background:#6366f1;
color:white;
cursor:pointer;
margin-top:5px;
}

button:hover{
background:#4f46e5;
}

.results{
margin-top:25px;
}

.bio{
background:#334155;
padding:10px;
border-radius:6px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.copy{
background:#6366f1;
border:none;
padding:5px 8px;
border-radius:5px;
color:white;
cursor:pointer;
font-size:12px;
}

</style>

<script>

async function gerarBio(){

let profissao = document.getElementById("profissao").value
let habilidade = document.getElementById("habilidade").value
let cidade = document.getElementById("cidade").value

let resposta = await fetch("/gerar",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
profissao:profissao,
habilidade:habilidade,
cidade:cidade
})

})

let bios = await resposta.json()

let area = document.getElementById("results")

area.innerHTML=""

bios.forEach(function(bio){

let div = document.createElement("div")

div.className="bio"

div.innerHTML = `
<span>${bio}</span>
<button class="copy" onclick="copiar('${bio}')">Copiar</button>
`

area.appendChild(div)

})

}

function copiar(texto){

navigator.clipboard.writeText(texto)

alert("Bio copiada!")

}

</script>

</head>

<body>

<div class="container">

<h1>BioCraft AI</h1>

<div class="subtitle">
Gerador inteligente de bios para Instagram
</div>

<input id="profissao" placeholder="Sua profissão">
<input id="habilidade" placeholder="Sua habilidade">
<input id="cidade" placeholder="Sua cidade">

<button onclick="gerarBio()">Gerar Bios</button>

<button onclick="gerarBio()">Gerar Novamente</button>

<div id="results" class="results"></div>

</div>

</body>
</html>
