<!DOCTYPE html>
<html>
<head>
<title>Gerador de Bio para Instagram</title>

<style>

body{
font-family: Arial;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
width:400px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:5px;
border:1px solid #ccc;
}

button{
background:#ff2d55;
color:white;
border:none;
padding:12px;
width:100%;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#e0264a;
}

.bio{
background:#fafafa;
padding:10px;
margin-top:10px;
border-radius:5px;
}

</style>
</head>

<body>

<div class="container">

<h2>Gerador de Bio para Instagram</h2>

<form method="POST">

<input name="profissao" placeholder="Sua profissão">

<input name="habilidade" placeholder="Sua habilidade">

<input name="cidade" placeholder="Sua cidade">

<button type="submit">Gerar Bio</button>

</form>

{% for bio in bios %}

<div class="bio">{{bio}}</div>

{% endfor %}

</div>

</body>
</html>
